name: CI
on: [push]
jobs:
  lhci:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse Run
        uses: shopify/lighthouse-ci-action@v1
        with:
          store: ${{ secrets.SHOP_STORE }} # Switched to match your clean SHOP_STORE secret
          client_id: ${{ secrets.SHOP_CLIENT_ID }} # Uses your new Client ID secret
          client_secret: ${{ secrets.SHOP_CLIENT_SECRET }} # Uses your new Client Secret secret
          collection_handle: all
          pull_theme: ${{ secrets.SHOP_PULL_THEME }}
          # Removed the missing password and legacy token variables causing the 401 error
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
